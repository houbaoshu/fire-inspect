x-application-environment: &application-environment
  FIRE_INSPECT_ENV: production
  FIRE_INSPECT_SECRET_KEY: ${FIRE_INSPECT_SECRET_KEY:?set FIRE_INSPECT_SECRET_KEY}
  FIRE_INSPECT_ALLOWED_HOSTS: ${FIRE_INSPECT_ALLOWED_HOSTS:?set FIRE_INSPECT_ALLOWED_HOSTS}
  FIRE_INSPECT_PUBLIC_BASE_URL: ${FIRE_INSPECT_PUBLIC_BASE_URL:?set FIRE_INSPECT_PUBLIC_BASE_URL}
  FIRE_INSPECT_CSRF_TRUSTED_ORIGINS: ${FIRE_INSPECT_CSRF_TRUSTED_ORIGINS:?set FIRE_INSPECT_CSRF_TRUSTED_ORIGINS}
  FIRE_INSPECT_COOKIE_SECURE: "true"
  FIRE_INSPECT_DATA_ROOT: /data
  FIRE_INSPECT_WORKER_CONCURRENCY: ${FIRE_INSPECT_WORKER_CONCURRENCY:-2}
  FIRE_INSPECT_WEB_WORKERS: ${FIRE_INSPECT_WEB_WORKERS:-3}
  FIRE_INSPECT_WEB_TIMEOUT: ${FIRE_INSPECT_WEB_TIMEOUT:-600}
  FIRE_INSPECT_WEB_GRACEFUL_TIMEOUT: ${FIRE_INSPECT_WEB_GRACEFUL_TIMEOUT:-30}
  FIRE_INSPECT_MAX_UPLOAD_BYTES: ${FIRE_INSPECT_MAX_UPLOAD_BYTES:-536870912}
  FIRE_INSPECT_MAX_INSPECTION_BYTES: ${FIRE_INSPECT_MAX_INSPECTION_BYTES:-2147483648}
  FIRE_INSPECT_MAX_MATERIALS_PER_INSPECTION: ${FIRE_INSPECT_MAX_MATERIALS_PER_INSPECTION:-50}
  FIRE_INSPECT_MAX_MEDIA_DURATION_MS: ${FIRE_INSPECT_MAX_MEDIA_DURATION_MS:-7200000}
  FIRE_INSPECT_MAX_CONCURRENT_UPLOADS: ${FIRE_INSPECT_MAX_CONCURRENT_UPLOADS:-4}
  FIRE_INSPECT_REQUIRED_FONTS: FangSong,KaiTi,Microsoft YaHei UI,Microsoft YaHei,SimSun,FZXiaoBiaoSong-B05S
  XDG_CACHE_HOME: /tmp/fire-inspect-cache
  FIRE_INSPECT_ASR_PROVIDER: ${FIRE_INSPECT_ASR_PROVIDER:-disabled}
  FIRE_INSPECT_ASR_ENDPOINT: ${FIRE_INSPECT_ASR_ENDPOINT:-}
  FIRE_INSPECT_ASR_MODEL: ${FIRE_INSPECT_ASR_MODEL:-}
  FIRE_INSPECT_ASR_API_KEY: ${FIRE_INSPECT_ASR_API_KEY:-}
  FIRE_INSPECT_ASR_TIMEOUT: ${FIRE_INSPECT_ASR_TIMEOUT:-120}
  FIRE_INSPECT_LLM_PROVIDER: ${FIRE_INSPECT_LLM_PROVIDER:-disabled}
  FIRE_INSPECT_LLM_ENDPOINT: ${FIRE_INSPECT_LLM_ENDPOINT:-}
  FIRE_INSPECT_LLM_MODEL: ${FIRE_INSPECT_LLM_MODEL:-}
  FIRE_INSPECT_LLM_API_KEY: ${FIRE_INSPECT_LLM_API_KEY:-}
  FIRE_INSPECT_LLM_TIMEOUT: ${FIRE_INSPECT_LLM_TIMEOUT:-120}
  FIRE_INSPECT_VISION_PROVIDER: ${FIRE_INSPECT_VISION_PROVIDER:-disabled}
  FIRE_INSPECT_VISION_ENDPOINT: ${FIRE_INSPECT_VISION_ENDPOINT:-}
  FIRE_INSPECT_VISION_MODEL: ${FIRE_INSPECT_VISION_MODEL:-}
  FIRE_INSPECT_VISION_API_KEY: ${FIRE_INSPECT_VISION_API_KEY:-}
  FIRE_INSPECT_VISION_TIMEOUT: ${FIRE_INSPECT_VISION_TIMEOUT:-120}
  FIRE_INSPECT_EMBEDDING_PROVIDER: ${FIRE_INSPECT_EMBEDDING_PROVIDER:-disabled}
  FIRE_INSPECT_EMBEDDING_ENDPOINT: ${FIRE_INSPECT_EMBEDDING_ENDPOINT:-}
  FIRE_INSPECT_EMBEDDING_MODEL: ${FIRE_INSPECT_EMBEDDING_MODEL:-}
  FIRE_INSPECT_EMBEDDING_API_KEY: ${FIRE_INSPECT_EMBEDDING_API_KEY:-}
  FIRE_INSPECT_EMBEDDING_TIMEOUT: ${FIRE_INSPECT_EMBEDDING_TIMEOUT:-120}

x-application-read-only: &application-read-only true

services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: fire_inspect
      POSTGRES_USER: fire_inspect_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      FIRE_INSPECT_DB_MIGRATION_PASSWORD: ${FIRE_INSPECT_DB_MIGRATION_PASSWORD:?set FIRE_INSPECT_DB_MIGRATION_PASSWORD}
      FIRE_INSPECT_DB_RUNTIME_PASSWORD: ${FIRE_INSPECT_DB_RUNTIME_PASSWORD:?set FIRE_INSPECT_DB_RUNTIME_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-fire-inspect-roles.sh:ro
    user: "postgres:postgres"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=999,gid=999,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=3775
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire_inspect_bootstrap -d fire_inspect"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    logging: &local-log-rotation
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build: .
    restart: unless-stopped
    command: ["web"]
    environment: &runtime-application-environment
      <<: *application-environment
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: fire_inspect
      PGUSER: fire_inspect_runtime
      PGPASSWORD: ${FIRE_INSPECT_DB_RUNTIME_PASSWORD:?set FIRE_INSPECT_DB_RUNTIME_PASSWORD}
      FIRE_INSPECT_DATABASE_ROLE: fire_inspect_runtime
    volumes: &application-volumes
      - application-data:/data
      - ./deploy/fonts:/usr/local/share/fonts/fire-inspect:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    user: "10001:10001"
    read_only: true
    tmpfs: &application-tmpfs
      - /tmp:rw,noexec,nosuid,nodev,size=1g,uid=10001,gid=10001,mode=0700
    cap_drop: &application-cap-drop
      - ALL
    security_opt: &application-security-options
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    logging: *local-log-rotation

  migrate:
    build: .
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *application-environment
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: fire_inspect
      PGUSER: fire_inspect_migrator
      PGPASSWORD: ${FIRE_INSPECT_DB_MIGRATION_PASSWORD:?set FIRE_INSPECT_DB_MIGRATION_PASSWORD}
      FIRE_INSPECT_DATABASE_ROLE: fire_inspect_migrator
    volumes: *application-volumes
    depends_on:
      db:
        condition: service_healthy
    user: "10001:10001"
    read_only: *application-read-only
    tmpfs: *application-tmpfs
    cap_drop: *application-cap-drop
    security_opt: *application-security-options
    logging: *local-log-rotation

  worker:
    build: .
    restart: unless-stopped
    command: ["worker"]
    environment: *runtime-application-environment
    volumes: *application-volumes
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs: *application-tmpfs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging: *local-log-rotation

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "${FIRE_INSPECT_HTTPS_PORT:-443}:8443"
      - "${FIRE_INSPECT_HTTP_PORT:-80}:8080"
    volumes:
      - application-data:/data:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *local-log-rotation

volumes:
  postgres-data:
  application-data:
