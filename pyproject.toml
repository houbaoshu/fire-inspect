[project]
name = "fire-inspect"
version = "0.1.0"
description = "消防监督检查 AI 辅助系统 MVP"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "docxtpl>=0.19",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "rq>=2.1",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/conftest.py" = ["E402", "I001"]
