[project]
name = "fire-inspect"
version = "0.1.0"
description = "消防监督检查 AI 辅助系统"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16.5,<2",
  "boto3>=1.40.0,<2",
  "celery[redis]>=5.5.3,<6",
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  "lxml>=6.0.0,<7",
  "pgvector>=0.4.1,<1",
  "pillow>=11.3.0,<13",
  "psycopg[binary]>=3.2.9,<4",
  "pwdlib[argon2]>=0.2.1,<1",
  "pydantic-settings>=2.10.1,<3",
  "pypdf>=6.0.0,<7",
  "python-docx>=1.2.0,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=6.4.0,<7",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.10,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI dependency injection intentionally calls Depends in signatures.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
