[project]
name = "fire-inspect"
version = "0.1.0"
description = "消防监督检查 AI 辅助系统"
readme = "docs/PRD.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "lxml>=6,<7",
  "pdfplumber>=0.11,<0.12",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<3.4",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
]

[dependency-groups]
dev = [
  "freezegun>=1.5,<2",
  "factory-boy>=3.3,<4",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_inspect"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fire_inspect.config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "local_acceptance: requires authorized local acceptance assets",
  "real_ai: requires explicitly authorized real AI endpoints",
  "windows_docx: requires the designated Windows Word/WPS environment",
  "postgres: requires a PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001", "DJ008", "DJ012", "E501"]

[tool.coverage.run]
source = ["fire_inspect"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
