# Include this file inside the production server block after the protected API/file locations.
# Business routes must fall back to the React entry point so a direct refresh never returns 404.
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store";
}

location / {
    try_files $uri $uri/ /index.html;
}
