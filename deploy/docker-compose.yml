services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fire
      POSTGRES_PASSWORD: fire
      POSTGRES_DB: fire_inspect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire -d fire_inspect"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    environment:
      DATABASE_URL: postgresql+psycopg://fire:fire@db:5432/fire_inspect
      DATA_DIR: /data
      FI_SEED_DIR: /seed
      # 五组 AI 端点：见 .env / .env.example，全部可指向内网服务
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-qwen3-asr-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-flash}
      VL_BASE_URL: ${VL_BASE_URL:-}
      VL_API_KEY: ${VL_API_KEY:-}
      VL_MODEL: ${VL_MODEL:-qwen3-vl-flash}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3.7-text-embedding}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    volumes:
      - appdata:/data
      # 种子数据（消防法 PDF、三份模板）随仓库挂载；生产可改为镜像内 COPY
      - ../testdata/knowledge:/seed/knowledge:ro
      - ../docs:/seed/templates:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
