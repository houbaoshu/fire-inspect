services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: fire_inspect
      POSTGRES_USER: fire_inspect
      POSTGRES_PASSWORD: fire_inspect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire_inspect"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: fire-inspect
      MINIO_ROOT_PASSWORD: change-me-now
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: ["uv", "run", "rq", "worker", "--url", "redis://redis:6379/0"]
    env_file: ../.env
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
