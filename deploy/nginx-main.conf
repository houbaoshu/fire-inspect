worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    log_format safe_access '$remote_addr method=$request_method path=$uri '
                           'status=$status bytes=$body_bytes_sent request_id=$request_id';
    access_log /dev/stdout safe_access;

    map "$request_method:$uri" $upload_limit_key {
        default "";
        "~^POST:/api/v1/inspections/[0-9a-fA-F-]{36}/materials/?$" $binary_remote_addr;
    }
    limit_conn_zone $upload_limit_key zone=upload_concurrency:10m;
    limit_conn_status 429;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /tmp/fire-inspect-nginx/*.conf;
}
